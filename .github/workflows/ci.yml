name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  DOTNET_VERSION: '8.0.x'
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '22'

jobs:
  # =============================================================================
  # .NET API - Build & Test
  # =============================================================================
  api:
    name: API (ASP.NET Core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore API
        run: dotnet restore src/NexaAI.Api/NexaAI.Api.csproj

      - name: Restore Core
        run: dotnet restore src/NexaAI.Core/NexaAI.Core.csproj

      - name: Build Core
        run: dotnet build src/NexaAI.Core/NexaAI.Core.csproj --no-restore -c Release

      - name: Build API
        run: dotnet build src/NexaAI.Api/NexaAI.Api.csproj --no-restore -c Release

      - name: Test API
        run: dotnet test src/NexaAI.Tests --configuration Release --verbosity normal --collect:"XPlat Code Coverage" || true

  # =============================================================================
  # Python AI Service - Lint, Type Check, Test
  # =============================================================================
  ai:
    name: AI Service (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/NexaAI.AI
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: 'src/NexaAI.AI/requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint (Ruff)
        run: ruff check app tests || true

      - name: Type check (mypy)
        run: mypy app --ignore-missing-imports || true

      - name: Test (pytest)
        run: pytest tests -q --cov=app --cov-report=term-missing

  # =============================================================================
  # React Frontend - Lint, Typecheck, Test, Build
  # =============================================================================
  web:
    name: Web (React + TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/NexaAI.Web
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint || true

      - name: Test
        run: npm test -- --run || true

      - name: Build
        run: npm run build

  # =============================================================================
  # Docker Compose - Config Validation
  # =============================================================================
  docker:
    name: Docker Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate compose file
        run: |
          cp .env.example .env
          docker compose -f docker/docker-compose.yml config --quiet
          echo "Docker Compose configuration is valid"