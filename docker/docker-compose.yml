services:
  # =============================================================================
  # PostgreSQL with pgvector for Vector Storage
  # =============================================================================
  postgres:
    image: pgvector/pgvector:pg16
    container_name: nexai-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nexai}
      POSTGRES_USER: ${POSTGRES_USER:-nexai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../database/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nexai} -d ${POSTGRES_DB:-nexai}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - nexai-network
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

  # =============================================================================
  # Neo4j for Knowledge Graph (Optional - enable with --profile optional)
  # =============================================================================
  neo4j:
    image: neo4j:5.18
    container_name: nexai-neo4j
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
      NEO4J_PLUGINS: '["apoc", "graph-data-science"]'
      NEO4J_dbms_memory_heap_initial__size: 512m
      NEO4J_dbms_memory_heap_max__size: 2g
      NEO4J_dbms_memory_pagecache_size: 1g
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/var/lib/neo4j/import
      - neo4j_plugins:/plugins
    ports:
      - "7474:7474"
      - "7687:7687"
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "${NEO4J_PASSWORD}", "RETURN 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - nexai-network
    profiles:
      - optional
    deploy:
      resources:
        limits:
          memory: 3G
        reservations:
          memory: 1G

  # =============================================================================
  # Ollama for Local LLM Inference
  # =============================================================================
  ollama:
    image: ollama/ollama:0.3.12
    container_name: nexai-ollama
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_ORIGINS: "*"
      OLLAMA_MODELS: /root/.ollama/models
    volumes:
      - ollama_data:/root/.ollama
      - ./scripts/ollama-init.sh:/ollama-init.sh:ro
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - nexai-network
    deploy:
      resources:
        limits:
          memory: 12G
        reservations:
          memory: 8G
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    entrypoint: ["/bin/sh", "-c", "/ollama-init.sh & ollama serve"]

  # =============================================================================
  # Microsoft Presidio for PII Detection (Optional)
  # =============================================================================
  presidio-analyzer:
    image: mcr.microsoft.com/presidio-analyzer:2.2.357
    container_name: nexai-presidio-analyzer
    environment:
      - PRESIDIO_ANALYZER_PORT=3000
      - PRESIDIO_LANGUAGE=en
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - nexai-network
    profiles:
      - optional
    deploy:
      resources:
        limits:
          memory: 2G

  presidio-anonymizer:
    image: mcr.microsoft.com/presidio-anonymizer:2.2.357
    container_name: nexai-presidio-anonymizer
    environment:
      - PRESIDIO_ANONYMIZER_PORT=3001
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - nexai-network
    profiles:
      - optional
    deploy:
      resources:
        limits:
          memory: 1G

  # =============================================================================
  # ASP.NET Core Web API (Main Backend)
  # =============================================================================
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
      target: development
    container_name: nexai-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__Default=Host=postgres;Database=${POSTGRES_DB:-nexai};Username=${POSTGRES_USER:-nexai};Password=${POSTGRES_PASSWORD};Include Error Detail=true
      - Jwt__Secret=${JWT_SECRET}
      - Jwt__Issuer=${JWT_ISSUER:-NexaAI}
      - Jwt__Audience=${JWT_AUDIENCE:-NexaAI}
      - Jwt__ExpiryMinutes=${JWT_EXPIRY_MINUTES:-60}
      - Jwt__RefreshExpiryDays=${JWT_REFRESH_EXPIRY_DAYS:-7}
      - Ollama__BaseUrl=http://ollama:11434
      - Ollama__LlmModel=${OLLAMA_LLM_MODEL:-llama3.1:8b}
      - Ollama__EmbeddingModel=${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
      - AIService__BaseUrl=http://ai:8000
      - AIService__ApiKey=${AI_SERVICE_API_KEY}
      - Presidio__AnalyzerUrl=http://presidio-analyzer:3000
      - Presidio__AnonymizerUrl=http://presidio-anonymizer:3000
      - Presidio__Enabled=${ENABLE_PRESIDIO:-true}
      - FeatureFlags__EnableNeo4j=${ENABLE_NEO4J:-false}
      - FeatureFlags__EnableMcp=${ENABLE_MCP:-true}
      - FeatureFlags__EnableEvaluation=${ENABLE_EVALUATION:-true}
      - Logging__LogLevel__Default=Information
      - Logging__LogLevel__Microsoft.AspNetCore=Warning
    ports:
      - "5000:8080"
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
      ai:
        condition: service_healthy
    networks:
      - nexai-network
    volumes:
      - ../src/NexaAI.Api:/app/src/NexaAI.Api:ro
    develop:
      watch:
        - action: sync
          path: ../src/NexaAI.Api
          target: /app/src/NexaAI.Api
        - action: rebuild
          path: ../src/NexaAI.Api/NexaAI.Api.csproj

  # =============================================================================
  # Python FastAPI AI Service
  # =============================================================================
  ai:
    build:
      context: ..
      dockerfile: docker/Dockerfile.ai
      target: development
    container_name: nexai-ai
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_LLM_MODEL=${OLLAMA_LLM_MODEL:-llama3.1:8b}
      - OLLAMA_EMBEDDING_MODEL=${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
      - OLLAMA_NUM_CTX=${OLLAMA_NUM_CTX:-8192}
      - OLLAMA_NUM_PREDICT=${OLLAMA_NUM_PREDICT:-2048}
      - OLLAMA_TEMPERATURE=${OLLAMA_TEMPERATURE:-0.1}
      - API_BASE_URL=http://api:8080
      - API_KEY=${AI_SERVICE_API_KEY}
      - PRESIDIO_ANALYZER_URL=http://presidio-analyzer:3000
      - PRESIDIO_ANONYMIZER_URL=http://presidio-anonymizer:3000
      - PRESIDIO_ENABLED=${ENABLE_PRESIDIO:-true}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - FEATURE_ENABLE_NEO4J=${ENABLE_NEO4J:-false}
      - FEATURE_ENABLE_MCP=${ENABLE_MCP:-true}
      - FEATURE_ENABLE_EVALUATION=${ENABLE_EVALUATION:-true}
    ports:
      - "8000:8000"
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - nexai-network
    volumes:
      - ../src/NexaAI.AI:/app:ro
    develop:
      watch:
        - action: sync
          path: ../src/NexaAI.AI
          target: /app
        - action: rebuild
          path: ../src/NexaAI.AI/requirements.txt

  # =============================================================================
  # React Frontend (Vite + TypeScript)
  # =============================================================================
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
      target: development
    container_name: nexai-web
    environment:
      - VITE_API_BASE_URL=http://localhost:5000
      - VITE_WS_BASE_URL=ws://localhost:5000
    ports:
      - "3000:5173"
    depends_on:
      - api
    networks:
      - nexai-network
    volumes:
      - ../src/NexaAI.Web:/app:ro
      - /app/node_modules
    develop:
      watch:
        - action: sync
          path: ../src/NexaAI.Web
          target: /app
          ignore:
            - node_modules/
            - dist/
        - action: rebuild
          path: ../src/NexaAI.Web/package.json

# =============================================================================
# Networks
# =============================================================================
networks:
  nexai-network:
    driver: bridge
    name: nexai-network

# =============================================================================
# Volumes
# =============================================================================
volumes:
  postgres_data:
    name: nexai-postgres-data
  neo4j_data:
    name: nexai-neo4j-data
  neo4j_logs:
    name: nexai-neo4j-logs
  neo4j_import:
    name: nexai-neo4j-import
  neo4j_plugins:
    name: nexai-neo4j-plugins
  ollama_data:
    name: nexai-ollama-data